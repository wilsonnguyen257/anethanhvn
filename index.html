    <!-- Be Vietnam Pro (body+nav+labels+rich-text editor content) and Playfair
         Display (700 only, display/headings) — both vetted for full Vietnamese
         diacritic coverage. DESIGN.md's target is 400/600 Be Vietnam Pro only;
         500/700/italic stay loaded until each page's font-medium usage is
         migrated to font-semibold and the rich-text editor's italic toggle is
         re-checked, to avoid an unstyled-weight regression mid-rollout.
         See DESIGN.md § Typography. -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <title>Cộng Đoàn Công Giáo Việt Nam Anê Thành</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Church",
      "name": "Cộng Đoàn Công Giáo Việt Nam Anê Thành",
      "alternateName": "Vietnamese Catholic Community St Ane Le Thi Thanh",
      "url": "https://anethanhvn.com/",
      "logo": "https://anethanhvn.com/logo.png",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "138 Woodhouse Grove",
        "addressLocality": "Box Hill North",
        "addressRegion": "VIC",
        "postalCode": "3129",
        "addressCountry": "AU"
      }
    }
    </script>
    <script>
      // SPA GitHub Pages redirect workaround
      // Source: https://github.com/rafgraph/spa-github-pages
      // Decodes the path 404.html encoded into the query string back into
      // the real URL, so React Router sees the originally requested route.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
